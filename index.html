<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Progress dashboard for Atahan Uz's M.S. thesis on TurkEval at Boğaziçi University.">
<title>TurkEval Thesis Progress</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F3533'/%3E%3Crect x='6' y='13' width='20' height='6' rx='3' fill='%23355250'/%3E%3Crect x='6' y='13' width='12' height='6' rx='3' fill='%23F2B33D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Mono:wght@400;500&display=swap">
<style>
:root {
  color-scheme: light;
  --ground: #EEF2F0;
  --surface: #FFFFFF;
  --ink: #142220;
  --ink-2: #4B5D59;
  --ink-3: #627370;
  --rule: #DAE2DF;
  --track: #E3E9E7;
  --done: #008A7A;
  --done-track: #D2ECE7;
  --prog: #C27A0E;
  --prog-track: #F4E7D0;
  --todo: #8A9A96;
  --accent: #0B5E58;
  --on-accent: #FFFFFF;
  --delta-up: #00705F;
  --band: #0F3533;
  --band-ink: #F1F6F4;
  --band-ink-2: #A8C2BD;
  --band-ink-3: #7FA19B;
  --band-rule: rgba(255, 255, 255, .22);
  --band-track: rgba(255, 255, 255, .16);
  --band-done: #5CCDBE;
  --band-prog: #F2B33D;
  --warn-ink: #8A5600;
  --error-ink: #A3312B;
  --shadow: 0 1px 2px rgba(20, 34, 32, .04), 0 4px 14px rgba(20, 34, 32, .05);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --sans: "Archivo", "Helvetica Neue", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0C1312;
    --surface: #131C1B;
    --ink: #E3EBE9;
    --ink-2: #A6B7B3;
    --ink-3: #82938F;
    --rule: #22302D;
    --track: #1D2927;
    --done: #2BA596;
    --done-track: #15312D;
    --prog: #C2821F;
    --prog-track: #352918;
    --todo: #6E807C;
    --accent: #3FB5A6;
    --on-accent: #04110F;
    --delta-up: #6FD3C4;
    --band: #0F2624;
    --band-ink: #EAF2F0;
    --band-ink-2: #9DB6B1;
    --band-ink-3: #7A948F;
    --band-rule: rgba(255, 255, 255, .16);
    --band-track: rgba(255, 255, 255, .12);
    --band-done: #5CCDBE;
    --band-prog: #F2B33D;
    --warn-ink: #F0C06A;
    --error-ink: #F2958C;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .2);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0C1312;
  --surface: #131C1B;
  --ink: #E3EBE9;
  --ink-2: #A6B7B3;
  --ink-3: #82938F;
  --rule: #22302D;
  --track: #1D2927;
  --done: #2BA596;
  --done-track: #15312D;
  --prog: #C2821F;
  --prog-track: #352918;
  --todo: #6E807C;
  --accent: #3FB5A6;
  --on-accent: #04110F;
  --delta-up: #6FD3C4;
  --band: #0F2624;
  --band-ink: #EAF2F0;
  --band-ink-2: #9DB6B1;
  --band-ink-3: #7A948F;
  --band-rule: rgba(255, 255, 255, .16);
  --band-track: rgba(255, 255, 255, .12);
  --band-done: #5CCDBE;
  --band-prog: #F2B33D;
  --warn-ink: #F0C06A;
  --error-ink: #F2958C;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .2);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 14px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
}
body.is-editing { padding-bottom: 120px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.loading { margin: 0; padding: 32px 28px; color: var(--ink-3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Band: identity + overall ---------- */
.band { background: var(--band); color: var(--band-ink); }
.band :focus-visible { outline-color: var(--band-prog); }
.band-inner {
  max-width: 1320px;
  margin: 0 auto;
  padding-inline: 28px;
  padding-block: 20px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(300px, 400px);
  gap: 18px 48px;
  align-items: end;
}
.eyebrow {
  margin: 0 0 8px;
  font: 600 11.5px/1.2 var(--sans);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--band-prog);
}
h1 {
  margin: 0;
  font: 600 27px/1.12 var(--display);
  letter-spacing: -.015em;
  text-wrap: balance;
}
.meta { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--band-ink-2); }
.meta b { font-weight: 500; color: var(--band-ink-3); margin-right: 5px; }
.meta .stamp { color: var(--band-ink); }

.overall { display: grid; gap: 8px; }
.ov-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 22px; }
.label { margin: 0; font: 600 11.5px/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--band-ink-2); }
.label span { font-weight: 400; letter-spacing: .04em; text-transform: none; color: var(--band-ink-3); }
.ov-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.hero { margin: 0; font: 700 54px/.88 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.hero small { font-size: 26px; font-weight: 500; color: var(--band-ink-2); letter-spacing: 0; margin-left: 2px; }
.ov-side { display: grid; justify-items: end; gap: 4px; text-align: right; min-width: 0; }
.ov-delta { margin: 0; font-size: 12.5px; color: var(--band-ink-2); }
.ov-delta b { font: 500 12.5px var(--mono); color: var(--band-ink); }
.ov-delta[data-dir="up"] b { color: var(--band-done); }
.counts { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; padding: 0; list-style: none; font-size: 13px; color: var(--band-ink-2); }
.counts li { display: inline-flex; align-items: center; gap: 6px; }
.counts b { color: var(--band-ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.counts svg { width: 12px; height: 12px; flex: none; }
.counts [data-s="done"] svg { color: var(--band-done); }
.counts [data-s="progress"] svg { color: var(--band-prog); }
.counts [data-s="todo"] svg { color: var(--band-ink-3); }
.counts .ck { stroke: var(--band); }

.spark { position: relative; width: 132px; height: 30px; }
.spark svg { display: block; width: 100%; height: 100%; overflow: visible; }
.spark-area { fill: var(--band-track); }
.spark-line { fill: none; stroke: var(--band-ink-2); stroke-width: 1.75; stroke-linejoin: round; stroke-linecap: round; }
.spark-hit { fill: transparent; }
.spark-dot { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--band-prog); box-shadow: 0 0 0 2px var(--band); }

/* ---------- Bars ---------- */
.bar { display: block; height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--prog); transition: width .45s cubic-bezier(.2, .7, .2, 1); }
.bar[data-s="progress"] { background: var(--prog-track); }
.bar[data-s="done"] { background: var(--done-track); }
.bar[data-s="done"] > i { background: var(--done); }
.bar.bar--band { height: 10px; background: var(--band-track); }
.bar.bar--band > i { background: var(--band-prog); }
.bar.bar--band[data-s="done"] > i { background: var(--band-done); }
.bar.bar--sec { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 0; background: var(--rule); }
.bar.bar--sec > i { border-radius: 0 2px 2px 0; }

/* ---------- Board ---------- */
.board {
  max-width: 1320px;
  margin: 0 auto;
  padding-inline: 28px;
  padding-block: 20px 24px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.sec { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; scroll-margin-top: 16px; }
.sec-head { position: relative; display: flex; align-items: baseline; gap: 4px 10px; padding: 10px 16px 11px; }
.sec-head h2 { margin: 0; font: 700 12px/1.2 var(--sans); letter-spacing: .11em; text-transform: uppercase; }
.sec-ref { font: 400 11.5px var(--mono); color: var(--ink-3); }
.sec-sub { margin-left: auto; font-size: 12.5px; color: var(--ink-3); }
.sec-pct { font: 500 13.5px var(--mono); font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }

.row {
  display: grid;
  grid-template-columns: 14px minmax(0, 1fr) minmax(80px, 32%) auto;
  grid-template-areas:
    "ic title bar pct"
    ".  desc  desc desc";
  align-items: center;
  gap: 2px 12px;
  padding: 9px 16px;
}
.row + .row { border-top: 1px solid var(--rule); }
.ic { grid-area: ic; display: flex; width: 14px; height: 14px; }
.ic svg { width: 14px; height: 14px; }
.ic[data-s="done"] { color: var(--done); }
.ic[data-s="progress"] { color: var(--prog); }
.ic[data-s="todo"] { color: var(--todo); }
.ic .ck { stroke: var(--surface); }
.row-title { grid-area: title; display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; min-width: 0; }
.name { font: 600 14.5px/1.3 var(--sans); }
.ref { font: 400 11.5px var(--mono); color: var(--ink-3); }
.tag { font: 500 11.5px/1.5 var(--sans); padding: 0 8px; border-radius: 999px; background: var(--ground); border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; }
.row > .bar { grid-area: bar; }
.pct { grid-area: pct; display: flex; align-items: baseline; justify-content: flex-end; gap: 6px; min-width: 4.5ch; }
.pct-v { font: 500 13.5px var(--mono); font-variant-numeric: tabular-nums; }
.delta { font: 500 11px var(--mono); color: var(--ink-3); }
.delta[data-dir="up"] { color: var(--delta-up); }
.desc { grid-area: desc; margin: 0; font-size: 12.5px; line-height: 1.4; font-stretch: 94%; color: var(--ink-2); }

/* ---------- Buttons + edit mode ---------- */
.btn {
  font: 500 13px/1 var(--sans);
  padding: 8px 12px;
  border-radius: 7px;
  border: 1px solid var(--rule);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  text-decoration: none;
}
.btn:hover { border-color: var(--ink-3); }
.btn svg { width: 13px; height: 13px; }
.btn--band { background: transparent; border-color: var(--band-rule); color: var(--band-ink); padding: 6px 10px; }
.btn--band:hover { border-color: var(--band-ink-2); }
.btn--primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn--primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }

.edit {
  grid-column: 2 / -1;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 84px minmax(0, 1fr);
  align-items: center;
  gap: 8px 14px;
  margin-top: 6px;
  padding: 8px 10px;
  background: var(--ground);
  border-radius: 7px;
}
.edit input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); }
.num { display: flex; align-items: center; gap: 5px; color: var(--ink-3); font: 500 12.5px var(--mono); }
.edit input[type="number"], .edit input[type="text"] {
  width: 100%;
  min-width: 0;
  padding: 6px 8px;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--surface);
  color: var(--ink);
}
.edit input[type="number"] { font: 500 13.5px var(--mono); text-align: right; }
.edit input[type="text"] { font: 400 13.5px var(--sans); }
.edit input::placeholder { color: var(--ink-3); }

.editbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  padding: 12px 28px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--surface);
  border-top: 1px solid var(--rule);
  box-shadow: 0 -8px 24px rgba(20, 34, 32, .08);
}
.editbar-inner { max-width: 1264px; margin: 0 auto; display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; }
.editbar-msg { flex: 1 1 260px; margin: 0; font-size: 13.5px; color: var(--ink-2); }
.editbar-msg[data-tone="warn"] { color: var(--warn-ink); }
.editbar-msg[data-tone="error"] { color: var(--error-ink); }

/* ---------- Fit to one screen: tighten on shorter laptop screens ---------- */
@media (min-width: 760px) and (max-height: 760px) {
  .band-inner { padding-block: 14px; gap: 14px 40px; }
  .eyebrow { margin-bottom: 6px; }
  h1 { font-size: 23px; }
  .meta { margin-top: 7px; }
  .overall { gap: 6px; }
  .hero { font-size: 44px; }
  .board { padding-block: 14px 16px; gap: 12px; }
  .col { gap: 12px; }
  .sec-head { padding-block: 8px 9px; }
  .row { padding-block: 6px; }
}
@media (min-width: 760px) and (max-height: 600px) {
  .desc { display: none; }
}
@media (min-width: 760px) and (min-height: 900px) {
  .band-inner { padding-block: 26px 24px; }
  h1 { font-size: 30px; }
  .hero { font-size: 60px; }
  .board { padding-block: 24px 28px; }
  .row { padding-block: 11px; }
}
@media (min-width: 760px) and (max-width: 1040px) {
  .band-inner { grid-template-columns: minmax(0, 1fr) minmax(260px, 320px); gap: 14px 28px; }
  h1 { font-size: 22px; }
  .board, .band-inner { padding-inline: 20px; }
  .row { grid-template-columns: 14px minmax(0, 1fr) minmax(64px, 26%) auto; gap: 2px 10px; padding-inline: 14px; }
}

/* ---------- Phones: one column, scrolls ---------- */
@media (max-width: 759px) {
  .band-inner { grid-template-columns: 1fr; padding-inline: 16px; padding-block: 22px 20px; gap: 18px; }
  h1 { font-size: 23px; }
  .board { grid-template-columns: 1fr; padding-inline: 16px; padding-block: 16px 32px; gap: 14px; }
  .col { display: contents; }
  .board { display: flex; flex-direction: column; }
  .row {
    grid-template-columns: 14px minmax(0, 1fr) auto;
    grid-template-areas:
      "ic title pct"
      ".  bar   bar"
      ".  desc  desc";
    gap: 6px 10px;
    padding: 11px 14px;
  }
  .row > .bar { margin-top: 2px; }
  .edit { grid-template-columns: minmax(0, 1fr) 84px; }
  .edit .note { grid-column: 1 / -1; }
  .editbar { padding-inline: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .bar > i { transition: none; }
}
</style>
</head>
<body>
<div id="app"><p class="loading">Loading progress…</p></div>

<script>
(function () {
  'use strict';

  var REPO = 'atahanuz/thesis-progress';
  var EDIT_URL = 'https://github.com/' + REPO + '/edit/main/progress.json';
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var ICONS = {
    done: '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="6" fill="currentColor"/><path class="ck" d="M3.4 6.2l1.8 1.8 3.4-3.6" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    progress: '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 .8a5.2 5.2 0 0 1 0 10.4z" fill="currentColor"/></svg>',
    todo: '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.2 1.9"/></svg>'
  };
  var LABELS = { done: 'Done', progress: 'In progress', todo: 'Not started' };
  var PENCIL = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.3 2.3l2.4 2.4-8.4 8.4-3.1.7.7-3.1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';

  var app = document.getElementById('app');
  var saved = null;
  var draft = null;
  // The editor is only offered at …/#edit, so viewers following the plain link see a read-only page.
  var ui = { editing: false, canEdit: location.hash === '#edit', msg: '', tone: '' };

  /* ---------- helpers ---------- */
  function current() { return draft || saved; }
  function allItems(s) {
    var out = [];
    s.sections.forEach(function (sec) { sec.items.forEach(function (it) { out.push(it); }); });
    return out;
  }
  function findItem(s, id) {
    var its = allItems(s);
    for (var i = 0; i < its.length; i++) if (its[i].id === id) return its[i];
    return null;
  }
  function statusOf(p) { return p >= 100 ? 'done' : p > 0 ? 'progress' : 'todo'; }
  function mean(list) {
    if (!list.length) return 0;
    var t = 0;
    list.forEach(function (it) { t += it.pct; });
    return t / list.length;
  }
  function countDone(list) { return list.filter(function (it) { return it.pct >= 100; }).length; }
  function clampPct(v) {
    var n = Math.round(Number(v));
    if (!isFinite(n)) n = 0;
    return Math.max(0, Math.min(100, n));
  }
  function fmtDate(iso) {
    if (!iso) return '';
    var p = String(iso).split('-');
    return Number(p[2]) + ' ' + MONTHS[Number(p[1]) - 1] + ' ' + p[0];
  }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function signed(n) { return (n > 0 ? '+' : '−') + Math.abs(n); }
  function $(sel) { return app.querySelector(sel); }

  // Split sections into two columns with equal item counts, keeping proposal order within each column.
  function columns(s) {
    var cols = [[], []], load = [0, 0];
    s.sections.forEach(function (sec, i) {
      var c = load[1] < load[0] ? 1 : 0;
      cols[c].push({ sec: sec, order: i });
      load[c] += sec.items.length;
    });
    return cols;
  }

  /* ---------- templates (structure only; paint() fills the numbers) ---------- */
  function barHTML(cls, label, id) {
    return '<span' + (id ? ' id="' + id + '"' : '') + ' class="bar ' + cls + '" role="progressbar" aria-label="' + esc(label) + '" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></span>';
  }

  function bandHTML(s) {
    var t = s.thesis;
    return '<header class="band"><div class="band-inner">' +
      '<div class="ident">' +
        '<p class="eyebrow">M.S. thesis progress · <span lang="tr">Boğaziçi</span> University</p>' +
        '<h1>' + esc(t.title) + '</h1>' +
        '<ul class="meta">' +
          '<li>' + esc(t.author) + '</li>' +
          '<li><b>Advisor</b>' + esc(t.advisor) + '</li>' +
          '<li><b>Plan</b>' + esc(t.plan) + '</li>' +
          '<li><b>Updated</b><span class="stamp">' + esc(fmtDate(s.updated)) + '</span></li>' +
        '</ul>' +
      '</div>' +
      '<section class="overall" aria-label="Overall progress">' +
        '<div class="ov-top"><p class="label">Overall progress <span>· mean of ' + allItems(s).length + ' items</span></p><div id="actions">' + actionsHTML() + '</div></div>' +
        '<div class="ov-row"><p class="hero" id="ov-num"></p>' +
          '<div class="ov-side"><p class="ov-delta" id="ov-delta"></p>' + (ui.editing ? '' : sparkHTML(s.history)) + '</div></div>' +
        barHTML('bar--band', 'Overall progress', 'ov-bar') +
        '<ul class="counts" id="ov-counts"></ul>' +
      '</section>' +
    '</div></header>';
  }

  function actionsHTML() {
    if (!ui.canEdit || ui.editing) return '';
    return '<button class="btn btn--band" type="button" id="btn-edit">' + PENCIL + 'Update progress</button>';
  }

  function sparkHTML(h) {
    if (!h || h.length < 2) return '';
    var W = 132, H = 30;
    var t0 = Date.parse(h[0].date), t1 = Date.parse(h[h.length - 1].date);
    var span = Math.max(1, t1 - t0);
    var pts = h.map(function (e) {
      return { x: (Date.parse(e.date) - t0) / span * W, y: H - (e.overall / 100) * H, e: e };
    });
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join('');
    var area = line + 'L' + W + ',' + H + 'L0,' + H + 'Z';
    var hits = pts.map(function (p, i) {
      var left = i === 0 ? 0 : (pts[i - 1].x + p.x) / 2;
      var right = i === pts.length - 1 ? W : (p.x + pts[i + 1].x) / 2;
      return '<rect class="spark-hit" x="' + left.toFixed(1) + '" y="0" width="' + (right - left).toFixed(1) + '" height="' + H + '"><title>' + esc(fmtDate(p.e.date)) + ' · ' + Math.round(p.e.overall) + '%</title></rect>';
    }).join('');
    var last = pts[pts.length - 1];
    return '<div class="spark">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Overall progress at each update, ' + esc(fmtDate(h[0].date)) + ' to ' + esc(fmtDate(last.e.date)) + '">' +
        '<path class="spark-area" d="' + area + '"/>' +
        '<path class="spark-line" d="' + line + '" vector-effect="non-scaling-stroke"/>' +
        hits +
      '</svg>' +
      '<span class="spark-dot" style="left:' + (last.x / W * 100).toFixed(2) + '%;top:' + (last.y / H * 100).toFixed(2) + '%"></span>' +
    '</div>';
  }

  function rowHTML(it) {
    var edit = '';
    if (ui.editing) {
      var id = esc(it.id);
      edit = '<div class="edit">' +
        '<label class="sr" for="r-' + id + '">' + esc(it.name) + ' progress slider</label>' +
        '<input type="range" id="r-' + id + '" min="0" max="100" step="1" value="' + it.pct + '" data-for="' + id + '" data-field="pct">' +
        '<div class="num"><label class="sr" for="n-' + id + '">' + esc(it.name) + ' progress in percent</label>' +
          '<input type="number" id="n-' + id + '" min="0" max="100" step="1" inputmode="numeric" value="' + it.pct + '" data-for="' + id + '" data-field="pct"><span>%</span></div>' +
        '<label class="sr" for="t-' + id + '">' + esc(it.name) + ' note</label>' +
        '<input type="text" class="note" id="t-' + id + '" maxlength="60" placeholder="Short note, e.g. venue or next step" value="' + esc(it.note) + '" data-for="' + id + '" data-field="note">' +
      '</div>';
    }
    return '<div class="row" data-item="' + esc(it.id) + '">' +
      '<span class="ic" role="img"></span>' +
      '<div class="row-title"><span class="name">' + esc(it.name) + '</span>' +
        (it.ref ? '<span class="ref" title="Section of the June 2026 thesis proposal">' + esc(it.ref) + '</span>' : '') +
        '<span class="tag" hidden></span></div>' +
      barHTML('', it.name + ' progress') +
      '<span class="pct"><span class="delta" hidden></span><span class="pct-v"></span></span>' +
      '<p class="desc">' + esc(it.desc) + '</p>' +
      edit +
    '</div>';
  }

  function sectionHTML(sec, order) {
    return '<section class="sec" id="sec-' + esc(sec.id) + '" data-sec="' + esc(sec.id) + '" style="order:' + order + '">' +
      '<div class="sec-head"><h2>' + esc(sec.name) + '</h2>' +
        (sec.ref ? '<span class="sec-ref" title="Section of the June 2026 thesis proposal">' + esc(sec.ref) + '</span>' : '') +
        '<span class="sec-sub"></span><span class="sec-pct"></span>' +
        barHTML('bar--sec', sec.name + ' progress') +
      '</div>' +
      '<div class="list">' + sec.items.map(rowHTML).join('') + '</div>' +
    '</section>';
  }

  function boardHTML(s) {
    return '<main class="board">' + columns(s).map(function (col) {
      return '<div class="col">' + col.map(function (c) { return sectionHTML(c.sec, c.order); }).join('') + '</div>';
    }).join('') + '</main>';
  }

  function editbarHTML() {
    if (!ui.editing) return '';
    return '<div class="editbar" role="region" aria-label="Save changes"><div class="editbar-inner">' +
      '<p class="editbar-msg" id="eb-msg" aria-live="polite"></p>' +
      '<button class="btn" type="button" id="btn-cancel">Discard changes</button>' +
      '<a class="btn" href="' + EDIT_URL + '" target="_blank" rel="noopener">Open progress.json on GitHub</a>' +
      '<button class="btn btn--primary" type="button" id="btn-copy">Copy progress.json</button>' +
    '</div></div>';
  }

  /* ---------- render + paint ---------- */
  function render() {
    var s = current();
    document.body.classList.toggle('is-editing', ui.editing);
    app.innerHTML = bandHTML(s) + boardHTML(s) + editbarHTML();
    paint();
  }

  function setBar(el, p, st) {
    if (!el) return;
    el.setAttribute('data-s', st);
    el.setAttribute('aria-valuenow', String(p));
    el.firstElementChild.style.width = p + '%';
  }
  function setIcon(el, st) {
    if (el.getAttribute('data-s') === st) return;
    el.setAttribute('data-s', st);
    el.setAttribute('aria-label', LABELS[st]);
    el.title = LABELS[st];
    el.innerHTML = ICONS[st];
  }

  function paint() {
    var s = current();
    var showDelta = !ui.editing && !!s.previousUpdate;

    s.sections.forEach(function (sec) {
      sec.items.forEach(function (it) {
        var row = app.querySelector('[data-item="' + it.id + '"]');
        if (!row) return;
        var st = statusOf(it.pct);
        setIcon(row.querySelector('.ic'), st);
        setBar(row.querySelector('.row > .bar'), it.pct, st);
        row.querySelector('.pct-v').textContent = it.pct + '%';
        var tag = row.querySelector('.tag');
        tag.textContent = it.note || '';
        tag.hidden = !it.note;
        var d = row.querySelector('.delta');
        if (showDelta && it.delta) {
          d.hidden = false;
          d.textContent = signed(it.delta);
          d.setAttribute('data-dir', it.delta > 0 ? 'up' : 'down');
          d.title = 'Change since the update on ' + fmtDate(s.previousUpdate);
        } else {
          d.hidden = true;
        }
      });

      var secEl = app.querySelector('[data-sec="' + sec.id + '"]');
      if (!secEl) return;
      var sp = Math.round(mean(sec.items));
      secEl.querySelector('.sec-pct').textContent = sp + '%';
      secEl.querySelector('.sec-sub').textContent = countDone(sec.items) + ' of ' + sec.items.length + ' done';
      setBar(secEl.querySelector('.bar--sec'), sp, sp >= 100 ? 'done' : 'progress');
    });

    var its = allItems(s);
    var ov = Math.round(mean(its));
    $('#ov-num').innerHTML = ov + '<small>%</small>';
    setBar($('#ov-bar'), ov, ov >= 100 ? 'done' : 'progress');
    var c = { done: 0, progress: 0, todo: 0 };
    its.forEach(function (it) { c[statusOf(it.pct)]++; });
    $('#ov-counts').innerHTML = ['done', 'progress', 'todo'].map(function (k) {
      return '<li data-s="' + k + '">' + ICONS[k] + '<span><b>' + c[k] + '</b> ' + LABELS[k].toLowerCase() + '</span></li>';
    }).join('');

    var dEl = $('#ov-delta');
    dEl.removeAttribute('data-dir');
    if (ui.editing) {
      dEl.textContent = 'Preview — updates as you edit';
    } else {
      var prev = null;
      (s.history || []).forEach(function (h) { if (h.date === s.previousUpdate) prev = h; });
      if (prev) {
        var dd = ov - Math.round(prev.overall);
        dEl.setAttribute('data-dir', dd > 0 ? 'up' : dd < 0 ? 'down' : 'flat');
        dEl.innerHTML = '<b>' + (dd === 0 ? '±0' : signed(dd)) + ' pts</b> since ' + esc(fmtDate(prev.date));
      } else {
        var first = (s.history && s.history[0]) ? s.history[0].date : s.updated;
        dEl.textContent = 'Tracking since ' + fmtDate(first);
      }
    }

    if (ui.editing) paintEditbar();
  }

  function isDirty() {
    if (!draft) return false;
    var a = allItems(draft), b = allItems(saved);
    for (var i = 0; i < a.length; i++) {
      if (a[i].pct !== b[i].pct || (a[i].note || '') !== (b[i].note || '')) return true;
    }
    return false;
  }

  function paintEditbar() {
    var msg = document.getElementById('eb-msg');
    var copy = document.getElementById('btn-copy');
    if (!msg || !copy) return;
    var dirty = isDirty();
    if (ui.msg) {
      msg.textContent = ui.msg;
      msg.setAttribute('data-tone', ui.tone || '');
    } else {
      msg.removeAttribute('data-tone');
      msg.textContent = dirty
        ? 'Copy the updated file, then paste it over progress.json on GitHub and commit.'
        : 'Drag a slider or type a percentage. Notes show next to the item name.';
    }
    copy.disabled = !dirty;
  }

  /* ---------- editing ---------- */
  function startEdit() {
    draft = clone(saved);
    ui.editing = true;
    ui.msg = '';
    ui.tone = '';
    render();
  }
  function stopEdit() {
    draft = null;
    ui.editing = false;
    ui.msg = '';
    render();
  }

  // Stamps the date, per-item change since the previous update, and the history point used by the sparkline.
  function nextState() {
    var next = clone(draft);
    var today = todayISO();
    var sameDay = saved.updated === today;
    var prevUpdate = sameDay ? (saved.previousUpdate || null) : saved.updated;
    next.updated = today;
    next.previousUpdate = prevUpdate;

    allItems(next).forEach(function (it) {
      var old = findItem(saved, it.id);
      var change = it.pct - (old ? old.pct : 0);
      var total = prevUpdate ? (sameDay ? (old && old.delta ? old.delta : 0) : 0) + change : 0;
      if (total) it.delta = total; else delete it.delta;
    });

    var overall = Math.round(mean(allItems(next)) * 10) / 10;
    var hist = (saved.history || []).slice();
    if (hist.length && hist[hist.length - 1].date === today) hist[hist.length - 1] = { date: today, overall: overall };
    else hist.push({ date: today, overall: overall });
    next.history = hist;
    return next;
  }

  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copyUpdate() {
    if (!isDirty()) return;
    var text = JSON.stringify(nextState(), null, 2) + '\n';
    function copied() {
      ui.msg = 'Copied. On GitHub, replace everything in progress.json with it and commit; the site refreshes in about a minute.';
      ui.tone = '';
      paintEditbar();
    }
    function blocked() {
      ui.msg = 'The browser blocked copying. Try another browser, or edit progress.json on GitHub directly.';
      ui.tone = 'error';
      paintEditbar();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(copied, function () { if (legacyCopy(text)) copied(); else blocked(); });
    } else if (legacyCopy(text)) {
      copied();
    } else {
      blocked();
    }
  }

  /* ---------- events ---------- */
  app.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'btn-edit') startEdit();
    else if (b.id === 'btn-cancel') stopEdit();
    else if (b.id === 'btn-copy') copyUpdate();
  });

  app.addEventListener('input', function (e) {
    var t = e.target;
    var id = t.getAttribute('data-for');
    if (!id || !draft) return;
    var it = findItem(draft, id);
    if (!it) return;
    if (t.getAttribute('data-field') === 'pct') {
      if (t.type === 'number' && t.value === '') return;
      it.pct = clampPct(t.value);
      var other = document.getElementById((t.type === 'range' ? 'n-' : 'r-') + id);
      if (other) other.value = it.pct;
    } else {
      it.note = t.value.slice(0, 60);
    }
    if (ui.tone !== 'error') { ui.msg = ''; ui.tone = ''; }
    paint();
  });

  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.type !== 'number' || !draft) return;
    var it = findItem(draft, t.getAttribute('data-for'));
    if (it) t.value = it.pct;
  });

  window.addEventListener('hashchange', function () {
    if (location.hash !== '#edit' || ui.canEdit || !saved) return;
    ui.canEdit = true;
    var box = document.getElementById('actions');
    if (box && !ui.editing) box.innerHTML = actionsHTML();
  });

  /* ---------- boot ---------- */
  fetch('progress.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (s) { saved = s; render(); })
    .catch(function () {
      app.innerHTML = '<p class="loading">The progress data could not be loaded. Refresh the page to try again.</p>';
    });
})();
</script>
</body>
</html>
