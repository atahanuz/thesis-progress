<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Progress dashboard for Atahan Uz's M.S. thesis on TurkEval at Boğaziçi University.">
<title>TurkEval Thesis Progress</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='12' width='26' height='8' rx='4' fill='%23E2E9F3'/%3E%3Crect x='3' y='12' width='15' height='8' rx='4' fill='%231E5AA0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
:root {
  color-scheme: light;
  --ground: #F4F6F9;
  --surface: #FFFFFF;
  --ink: #132031;
  --ink-2: #4D5A6B;
  --ink-3: #6F7B8C;
  --rule: #DFE4EB;
  --rule-strong: #C9D1DC;
  --track: #E2E9F3;
  --accent: #1E5AA0;
  --accent-ink: #1A4F8C;
  --accent-tint: #E6EEF8;
  --on-accent: #FFFFFF;
  --good: #2D7A4F;
  --good-track: #DCEEE3;
  --good-tint: #E2F2E8;
  --good-ink: #1F6040;
  --idle-tint: #EDF0F4;
  --warn-ink: #8A5A00;
  --error-ink: #A8322D;
  --shadow: 0 1px 2px rgba(19, 32, 49, .05), 0 6px 20px rgba(19, 32, 49, .05);
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0E131A;
    --surface: #151C26;
    --ink: #E7ECF3;
    --ink-2: #A9B4C3;
    --ink-3: #8592A3;
    --rule: #253041;
    --rule-strong: #34425A;
    --track: #1D2B3E;
    --accent: #4D8FE0;
    --accent-ink: #8DBBF2;
    --accent-tint: #18283C;
    --on-accent: #08121F;
    --good: #3DA26C;
    --good-track: #17301F;
    --good-tint: #16301F;
    --good-ink: #7FD1A6;
    --idle-tint: #1C2430;
    --warn-ink: #F2C36B;
    --error-ink: #F29790;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0E131A;
  --surface: #151C26;
  --ink: #E7ECF3;
  --ink-2: #A9B4C3;
  --ink-3: #8592A3;
  --rule: #253041;
  --rule-strong: #34425A;
  --track: #1D2B3E;
  --accent: #4D8FE0;
  --accent-ink: #8DBBF2;
  --accent-tint: #18283C;
  --on-accent: #08121F;
  --good: #3DA26C;
  --good-track: #17301F;
  --good-tint: #16301F;
  --good-ink: #7FD1A6;
  --idle-tint: #1C2430;
  --warn-ink: #F2C36B;
  --error-ink: #F29790;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding-inline: 20px;
  padding-block: 40px 72px;
  display: grid;
  gap: 32px;
}
.wrap.is-editing { padding-block-end: 140px; }

/* Header */
.top { display: grid; gap: 12px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; min-height: 38px; }
.eyebrow {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--accent-ink);
}
h1 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 600;
  font-size: clamp(26px, 3.5vw, 36px);
  line-height: 1.14;
  letter-spacing: -.01em;
  max-width: 32ch;
  text-wrap: balance;
}
.meta { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 2px 0 0; padding: 0; list-style: none; color: var(--ink-2); font-size: 14px; }
.meta b { font-weight: 500; color: var(--ink-3); margin-right: 6px; }
.meta .stamp { color: var(--ink); }

/* Buttons and fields */
.btn {
  font: 500 14px/1 var(--sans);
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid var(--rule-strong);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn:hover { border-color: var(--ink-3); }
.btn svg { width: 14px; height: 14px; }
.btn--primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn--primary:hover { border-color: var(--accent-ink); filter: brightness(1.06); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.btn:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Bars */
.bar {
  display: block;
  height: 8px;
  background: var(--track);
  border-radius: 999px;
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--accent);
  border-radius: 999px;
  transition: width .45s cubic-bezier(.2, .7, .2, 1);
}
.bar[data-s="done"] { background: var(--good-track); }
.bar[data-s="done"] > i { background: var(--good); }
.bar--lg { height: 12px; }
.bar--sm { height: 6px; }

/* Status chips */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  justify-self: start;
  padding: 4px 10px 4px 8px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 500;
  line-height: 1.2;
  white-space: nowrap;
}
.chip svg, .counts svg { width: 12px; height: 12px; flex: none; }
.chip[data-s="done"] { background: var(--good-tint); color: var(--good-ink); }
.chip[data-s="progress"] { background: var(--accent-tint); color: var(--accent-ink); }
.chip[data-s="todo"] { background: var(--idle-tint); color: var(--ink-2); }
.ck { fill: none; stroke: var(--good-tint); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.counts .ck { stroke: var(--surface); }

/* Summary */
.summary {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr);
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.overall { padding: 26px 28px; display: grid; gap: 14px; align-content: start; border-right: 1px solid var(--rule); }
.label { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.hero-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hero { margin: 0; font: 600 64px/0.95 var(--sans); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.hero small { font-size: 30px; font-weight: 500; color: var(--ink-2); letter-spacing: 0; margin-left: 2px; }
.hero-note { margin: 0 0 4px; color: var(--ink-2); font-size: 13px; text-align: right; }
.counts { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0; list-style: none; font-size: 13.5px; color: var(--ink-2); }
.counts li { display: inline-flex; align-items: center; gap: 6px; }
.counts b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.counts [data-s="done"] svg { color: var(--good); }
.counts [data-s="progress"] svg { color: var(--accent); }
.counts [data-s="todo"] svg { color: var(--ink-3); }
.ov-delta { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.ov-delta[data-dir="up"] b { color: var(--good-ink); }
.ov-delta b { font: 500 13.5px var(--mono); }

.tiles { padding: 22px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-content: center; }
.tile {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px 10px;
  align-items: baseline;
  padding: 14px;
  border-radius: 10px;
  color: inherit;
  text-decoration: none;
}
.tile:hover { background: var(--ground); }
.tile .bar { grid-column: 1 / -1; }
.tile-name { font-weight: 600; font-size: 15px; }
.tile-ref { font: 400 12px var(--mono); color: var(--ink-3); margin-left: 6px; }
.tile-pct { font: 500 15px var(--mono); font-variant-numeric: tabular-nums; }
.tile-sub { grid-column: 1 / -1; font-size: 13px; color: var(--ink-3); margin-top: -2px; }

/* Trend */
.trend { margin: 4px 0 0; display: grid; gap: 6px; }
.trend-plot { position: relative; height: 56px; }
.trend-plot svg { display: block; width: 100%; height: 100%; overflow: visible; }
.trend-area { fill: var(--accent-tint); }
.trend-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.trend-grid { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 2 3; }
.trend-hit { fill: transparent; }
.trend-dot { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); }
.trend-axis { display: flex; justify-content: space-between; font: 400 11.5px var(--mono); color: var(--ink-3); }

/* Sections */
.sec { display: grid; gap: 10px; scroll-margin-top: 20px; }
.sec-head { display: flex; align-items: baseline; gap: 10px 14px; flex-wrap: wrap; padding-inline: 4px; }
.sec-head h2 { margin: 0; font: 600 13px/1.2 var(--sans); letter-spacing: .09em; text-transform: uppercase; }
.sec-ref { font: 400 12px var(--mono); color: var(--ink-3); }
.sec-pct { font: 500 13px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.sec-sub { margin-left: auto; font-size: 13px; color: var(--ink-3); }
.list { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; }

.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 118px minmax(120px, 210px) 56px;
  align-items: center;
  gap: 10px 20px;
  padding: 16px 20px;
}
.row + .row { border-top: 1px solid var(--rule); }
.row-title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.name { font-weight: 600; font-size: 15.5px; }
.ref { font: 400 12px var(--mono); color: var(--ink-3); }
.tag {
  font-size: 12px;
  font-weight: 500;
  padding: 1px 8px;
  border-radius: 6px;
  border: 1px solid var(--rule-strong);
  color: var(--ink-2);
  white-space: nowrap;
}
.desc { margin: 3px 0 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.45; max-width: 64ch; }
.pct { text-align: right; display: grid; justify-items: end; gap: 1px; }
.pct-v { font: 500 14px var(--mono); font-variant-numeric: tabular-nums; }
.delta { font: 500 11.5px var(--mono); color: var(--ink-3); }
.delta[data-dir="up"] { color: var(--good-ink); }

/* Edit mode */
.edit {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 92px minmax(0, 1fr);
  align-items: center;
  gap: 10px 16px;
  padding: 10px 12px;
  background: var(--ground);
  border-radius: 8px;
}
.edit input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); }
.num { display: flex; align-items: center; gap: 6px; color: var(--ink-3); font: 500 13px var(--mono); }
.edit input[type="number"], .edit input[type="text"] {
  width: 100%;
  min-width: 0;
  padding: 7px 9px;
  border: 1px solid var(--rule-strong);
  border-radius: 6px;
  background: var(--surface);
  color: var(--ink);
}
.edit input[type="number"] { font: 500 14px var(--mono); text-align: right; }
.edit input[type="text"] { font: 400 14px var(--sans); }
.edit input::placeholder { color: var(--ink-3); }

.editbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--surface);
  border-top: 1px solid var(--rule);
  box-shadow: 0 -8px 24px rgba(19, 32, 49, .08);
}
.editbar-inner { max-width: 1000px; margin: 0 auto; display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; }
.editbar-msg { flex: 1 1 260px; margin: 0; font-size: 14px; color: var(--ink-2); }
.editbar-msg[data-tone="warn"] { color: var(--warn-ink); }
.editbar-msg[data-tone="error"] { color: var(--error-ink); }

.foot { margin: 0; padding-inline: 4px; max-width: 76ch; font-size: 13px; color: var(--ink-3); }

@media (max-width: 760px) {
  .summary { grid-template-columns: 1fr; }
  .overall { border-right: 0; border-bottom: 1px solid var(--rule); padding: 22px 20px; }
  .tiles { padding: 12px; }
}
@media (max-width: 640px) {
  .wrap { padding-inline: 16px; padding-block: 28px 56px; gap: 28px; }
  .row { grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px 12px; padding: 14px 16px; }
  .row-main { grid-column: 1 / -1; }
  .edit { grid-template-columns: minmax(0, 1fr) 92px; }
  .edit .note { grid-column: 1 / -1; }
  .hero { font-size: 56px; }
  .hero-note { text-align: left; }
}
@media (max-width: 360px) {
  .tiles { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .bar > i { transition: none; }
}
a.btn { text-decoration: none; }
.loading { margin: 0; color: var(--ink-3); font-size: 14px; }
</style>
</head>
<body>
<main id="app" class="wrap"><p class="loading">Loading progress…</p></main>

<script>
(function () {
  'use strict';

  var REPO = 'atahanuz/thesis-progress';
  var EDIT_URL = 'https://github.com/' + REPO + '/edit/main/progress.json';
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var ICONS = {
    done: '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="6" fill="currentColor"/><path class="ck" d="M3.4 6.2l1.8 1.8 3.4-3.6"/></svg>',
    progress: '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 .8a5.2 5.2 0 0 1 0 10.4z" fill="currentColor"/></svg>',
    todo: '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.2 1.9"/></svg>'
  };
  var LABELS = { done: 'Done', progress: 'In progress', todo: 'Not started' };
  var PENCIL = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.3 2.3l2.4 2.4-8.4 8.4-3.1.7.7-3.1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';

  var app = document.getElementById('app');
  var saved = null;
  var draft = null;
  // The editor is only offered at …/#edit, so viewers following the plain link see a read-only page.
  var ui = { editing: false, canEdit: location.hash === '#edit', msg: '', tone: '' };

  /* ---------- helpers ---------- */
  function current() { return draft || saved; }
  function allItems(s) {
    var out = [];
    s.sections.forEach(function (sec) { sec.items.forEach(function (it) { out.push(it); }); });
    return out;
  }
  function findItem(s, id) {
    var its = allItems(s);
    for (var i = 0; i < its.length; i++) if (its[i].id === id) return its[i];
    return null;
  }
  function statusOf(p) { return p >= 100 ? 'done' : p > 0 ? 'progress' : 'todo'; }
  function mean(list) {
    if (!list.length) return 0;
    var t = 0;
    list.forEach(function (it) { t += it.pct; });
    return t / list.length;
  }
  function countDone(list) { return list.filter(function (it) { return it.pct >= 100; }).length; }
  function clampPct(v) {
    var n = Math.round(Number(v));
    if (!isFinite(n)) n = 0;
    return Math.max(0, Math.min(100, n));
  }
  function fmtDate(iso) {
    if (!iso) return '';
    var p = String(iso).split('-');
    return Number(p[2]) + ' ' + MONTHS[Number(p[1]) - 1] + ' ' + p[0];
  }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function signed(n) { return (n > 0 ? '+' : '−') + Math.abs(n); }
  function $(sel) { return app.querySelector(sel); }

  /* ---------- templates (structure only; paint() fills the numbers) ---------- */
  function barHTML(cls, label) {
    return '<span class="bar ' + cls + '" role="progressbar" aria-label="' + esc(label) + '" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></span>';
  }

  function headerHTML(s) {
    var t = s.thesis;
    return '<header class="top">' +
      '<div class="top-row"><p class="eyebrow">M.S. thesis progress · <span lang="tr">Boğaziçi</span> University</p><div id="actions">' + actionsHTML() + '</div></div>' +
      '<h1>' + esc(t.title) + '</h1>' +
      '<ul class="meta">' +
        '<li>' + esc(t.author) + '</li>' +
        '<li><b>Advisor</b>' + esc(t.advisor) + '</li>' +
        '<li><b>Plan</b>' + esc(t.plan) + '</li>' +
        '<li class="stamp"><b>Updated</b>' + esc(fmtDate(s.updated)) + '</li>' +
      '</ul>' +
    '</header>';
  }

  function actionsHTML() {
    if (!ui.canEdit || ui.editing) return '';
    return '<button class="btn" type="button" id="btn-edit">' + PENCIL + 'Update progress</button>';
  }

  function summaryHTML(s) {
    var n = allItems(s).length;
    var tiles = s.sections.map(function (sec) {
      return '<a class="tile" href="#sec-' + esc(sec.id) + '" data-tile="' + esc(sec.id) + '">' +
        '<span><span class="tile-name">' + esc(sec.name) + '</span>' + (sec.ref ? '<span class="tile-ref">' + esc(sec.ref) + '</span>' : '') + '</span>' +
        '<span class="tile-pct"></span>' +
        barHTML('bar--sm', sec.name + ' progress') +
        '<span class="tile-sub"></span>' +
      '</a>';
    }).join('');
    return '<section class="summary" aria-label="Summary">' +
      '<div class="overall">' +
        '<p class="label">Overall progress</p>' +
        '<div class="hero-row"><p class="hero" id="ov-num"></p><p class="hero-note">Mean of ' + n + ' tracked items,<br>equally weighted</p></div>' +
        barHTML('bar--lg', 'Overall progress').replace('class="bar', 'id="ov-bar" class="bar') +
        '<ul class="counts" id="ov-counts"></ul>' +
        '<p class="ov-delta" id="ov-delta"></p>' +
        (ui.editing ? '' : trendHTML(s.history)) +
      '</div>' +
      '<div class="tiles">' + tiles + '</div>' +
    '</section>';
  }

  function trendHTML(h) {
    if (!h || h.length < 2) return '';
    var W = 300, H = 56;
    var t0 = Date.parse(h[0].date), t1 = Date.parse(h[h.length - 1].date);
    var span = Math.max(1, t1 - t0);
    var pts = h.map(function (e) {
      return { x: (Date.parse(e.date) - t0) / span * W, y: H - (e.overall / 100) * H, e: e };
    });
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join('');
    var area = line + 'L' + W + ',' + H + 'L0,' + H + 'Z';
    var hits = pts.map(function (p, i) {
      var left = i === 0 ? 0 : (pts[i - 1].x + p.x) / 2;
      var right = i === pts.length - 1 ? W : (p.x + pts[i + 1].x) / 2;
      return '<rect class="trend-hit" x="' + left.toFixed(1) + '" y="0" width="' + (right - left).toFixed(1) + '" height="' + H + '"><title>' + esc(fmtDate(p.e.date)) + ' · ' + Math.round(p.e.overall) + '%</title></rect>';
    }).join('');
    var last = pts[pts.length - 1];
    return '<figure class="trend">' +
      '<figcaption class="label">Overall progress over time</figcaption>' +
      '<div class="trend-plot">' +
        '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Overall progress at each update, from ' + esc(fmtDate(h[0].date)) + ' to ' + esc(fmtDate(last.e.date)) + '">' +
          '<path class="trend-grid" d="M0,' + (H / 2) + 'H' + W + '" vector-effect="non-scaling-stroke"/>' +
          '<path class="trend-area" d="' + area + '"/>' +
          '<path class="trend-line" d="' + line + '" vector-effect="non-scaling-stroke"/>' +
          hits +
        '</svg>' +
        '<span class="trend-dot" style="left:' + (last.x / W * 100).toFixed(2) + '%;top:' + (last.y / H * 100).toFixed(2) + '%"></span>' +
      '</div>' +
      '<div class="trend-axis"><span>' + esc(fmtDate(h[0].date)) + '</span><span>' + esc(fmtDate(last.e.date)) + '</span></div>' +
    '</figure>';
  }

  function rowHTML(it) {
    var edit = '';
    if (ui.editing) {
      var id = esc(it.id);
      edit = '<div class="edit">' +
        '<label class="sr" for="r-' + id + '">' + esc(it.name) + ' progress slider</label>' +
        '<input type="range" id="r-' + id + '" min="0" max="100" step="1" value="' + it.pct + '" data-for="' + id + '" data-field="pct">' +
        '<div class="num"><label class="sr" for="n-' + id + '">' + esc(it.name) + ' progress in percent</label>' +
          '<input type="number" id="n-' + id + '" min="0" max="100" step="1" inputmode="numeric" value="' + it.pct + '" data-for="' + id + '" data-field="pct"><span>%</span></div>' +
        '<label class="sr" for="t-' + id + '">' + esc(it.name) + ' note</label>' +
        '<input type="text" class="note" id="t-' + id + '" maxlength="60" placeholder="Short note, e.g. venue or next step" value="' + esc(it.note) + '" data-for="' + id + '" data-field="note">' +
      '</div>';
    }
    return '<div class="row" data-item="' + esc(it.id) + '">' +
      '<div class="row-main">' +
        '<div class="row-title"><span class="name">' + esc(it.name) + '</span>' +
          (it.ref ? '<span class="ref">' + esc(it.ref) + '</span>' : '') +
          '<span class="tag" hidden></span></div>' +
        '<p class="desc">' + esc(it.desc) + '</p>' +
      '</div>' +
      '<span class="chip"></span>' +
      barHTML('', it.name + ' progress') +
      '<span class="pct"><span class="pct-v"></span><span class="delta" hidden></span></span>' +
      edit +
    '</div>';
  }

  function sectionHTML(sec) {
    return '<section class="sec" id="sec-' + esc(sec.id) + '" data-sec="' + esc(sec.id) + '">' +
      '<div class="sec-head"><h2>' + esc(sec.name) + '</h2>' +
        (sec.ref ? '<span class="sec-ref">' + esc(sec.ref) + '</span>' : '') +
        '<span class="sec-pct"></span><span class="sec-sub"></span></div>' +
      '<div class="list">' + sec.items.map(rowHTML).join('') + '</div>' +
    '</section>';
  }

  function footHTML(s) {
    return '<p class="foot">Progress is self-reported and updated by ' + esc(s.thesis.author) +
      '. Overall progress is the unweighted mean of every tracked item; section numbers (§) refer to the June 2026 thesis proposal.</p>';
  }

  function editbarHTML() {
    if (!ui.editing) return '';
    return '<div class="editbar" role="region" aria-label="Save changes"><div class="editbar-inner">' +
      '<p class="editbar-msg" id="eb-msg" aria-live="polite"></p>' +
      '<button class="btn" type="button" id="btn-cancel">Discard changes</button>' +
      '<a class="btn" href="' + EDIT_URL + '" target="_blank" rel="noopener">Open progress.json on GitHub</a>' +
      '<button class="btn btn--primary" type="button" id="btn-copy">Copy progress.json</button>' +
    '</div></div>';
  }

  /* ---------- render + paint ---------- */
  function render() {
    var s = current();
    app.classList.toggle('is-editing', ui.editing);
    app.innerHTML = headerHTML(s) + summaryHTML(s) + s.sections.map(sectionHTML).join('') + footHTML(s) + editbarHTML();
    paint();
  }

  function setBar(el, p, st) {
    if (!el) return;
    el.setAttribute('data-s', st);
    el.setAttribute('aria-valuenow', String(p));
    el.firstElementChild.style.width = p + '%';
  }
  function setChip(el, st) {
    if (el.getAttribute('data-s') === st) return;
    el.setAttribute('data-s', st);
    el.innerHTML = ICONS[st] + '<span>' + LABELS[st] + '</span>';
  }

  function paint() {
    var s = current();
    var showDelta = !ui.editing && !!s.previousUpdate;

    s.sections.forEach(function (sec) {
      sec.items.forEach(function (it) {
        var row = app.querySelector('[data-item="' + it.id + '"]');
        if (!row) return;
        var st = statusOf(it.pct);
        setChip(row.querySelector('.chip'), st);
        setBar(row.querySelector('.bar'), it.pct, st);
        row.querySelector('.pct-v').textContent = it.pct + '%';
        var tag = row.querySelector('.tag');
        tag.textContent = it.note || '';
        tag.hidden = !it.note;
        var d = row.querySelector('.delta');
        if (showDelta && it.delta) {
          d.hidden = false;
          d.textContent = signed(it.delta);
          d.setAttribute('data-dir', it.delta > 0 ? 'up' : 'down');
          d.title = 'Change since the update on ' + fmtDate(s.previousUpdate);
        } else {
          d.hidden = true;
        }
      });

      var sp = Math.round(mean(sec.items));
      var done = countDone(sec.items), n = sec.items.length;
      var sub = done + ' of ' + n + ' done';
      var secEl = app.querySelector('[data-sec="' + sec.id + '"]');
      if (secEl) {
        secEl.querySelector('.sec-pct').textContent = sp + '%';
        secEl.querySelector('.sec-sub').textContent = sub;
      }
      var tile = app.querySelector('[data-tile="' + sec.id + '"]');
      if (tile) {
        tile.querySelector('.tile-pct').textContent = sp + '%';
        setBar(tile.querySelector('.bar'), sp, sp >= 100 ? 'done' : 'progress');
        tile.querySelector('.tile-sub').textContent = sub;
      }
    });

    var its = allItems(s);
    var ov = Math.round(mean(its));
    $('#ov-num').innerHTML = ov + '<small>%</small>';
    setBar($('#ov-bar'), ov, ov >= 100 ? 'done' : 'progress');
    var c = { done: 0, progress: 0, todo: 0 };
    its.forEach(function (it) { c[statusOf(it.pct)]++; });
    $('#ov-counts').innerHTML = ['done', 'progress', 'todo'].map(function (k) {
      return '<li data-s="' + k + '">' + ICONS[k] + '<span><b>' + c[k] + '</b> ' + LABELS[k].toLowerCase() + '</span></li>';
    }).join('');

    var dEl = $('#ov-delta');
    dEl.removeAttribute('data-dir');
    if (ui.editing) {
      dEl.textContent = 'Preview — numbers update as you edit.';
    } else {
      var prev = null;
      (s.history || []).forEach(function (h) { if (h.date === s.previousUpdate) prev = h; });
      if (prev) {
        var dd = ov - Math.round(prev.overall);
        dEl.setAttribute('data-dir', dd > 0 ? 'up' : dd < 0 ? 'down' : 'flat');
        dEl.innerHTML = '<b>' + (dd === 0 ? '±0' : signed(dd)) + ' pts</b> since the update on ' + esc(fmtDate(prev.date));
      } else {
        var first = (s.history && s.history[0]) ? s.history[0].date : s.updated;
        dEl.textContent = 'Tracking since ' + fmtDate(first) + '. Changes show here after the next update.';
      }
    }

    if (ui.editing) paintEditbar();
  }

  function isDirty() {
    if (!draft) return false;
    var a = allItems(draft), b = allItems(saved);
    for (var i = 0; i < a.length; i++) {
      if (a[i].pct !== b[i].pct || (a[i].note || '') !== (b[i].note || '')) return true;
    }
    return false;
  }

  function paintEditbar() {
    var msg = document.getElementById('eb-msg');
    var copy = document.getElementById('btn-copy');
    if (!msg || !copy) return;
    var dirty = isDirty();
    if (ui.msg) {
      msg.textContent = ui.msg;
      msg.setAttribute('data-tone', ui.tone || '');
    } else {
      msg.removeAttribute('data-tone');
      msg.textContent = dirty
        ? 'Copy the updated file, then paste it over progress.json on GitHub and commit.'
        : 'Drag a slider or type a percentage. Notes show next to the item name.';
    }
    copy.disabled = !dirty;
  }

  /* ---------- editing ---------- */
  function startEdit() {
    draft = clone(saved);
    ui.editing = true;
    ui.msg = '';
    ui.tone = '';
    render();
  }
  function stopEdit() {
    draft = null;
    ui.editing = false;
    ui.msg = '';
    render();
  }

  // Stamps the date, per-item change since the previous update, and the history point used by the trend line.
  function nextState() {
    var next = clone(draft);
    var today = todayISO();
    var sameDay = saved.updated === today;
    var prevUpdate = sameDay ? (saved.previousUpdate || null) : saved.updated;
    next.updated = today;
    next.previousUpdate = prevUpdate;

    allItems(next).forEach(function (it) {
      var old = findItem(saved, it.id);
      var change = it.pct - (old ? old.pct : 0);
      var total = prevUpdate ? (sameDay ? (old && old.delta ? old.delta : 0) : 0) + change : 0;
      if (total) it.delta = total; else delete it.delta;
    });

    var overall = Math.round(mean(allItems(next)) * 10) / 10;
    var hist = (saved.history || []).slice();
    if (hist.length && hist[hist.length - 1].date === today) hist[hist.length - 1] = { date: today, overall: overall };
    else hist.push({ date: today, overall: overall });
    next.history = hist;
    return next;
  }

  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copyUpdate() {
    if (!isDirty()) return;
    var text = JSON.stringify(nextState(), null, 2) + '\n';
    function copied() {
      ui.msg = 'Copied. On GitHub, replace everything in progress.json with it and commit; the site refreshes in about a minute.';
      ui.tone = '';
      paintEditbar();
    }
    function blocked() {
      ui.msg = 'The browser blocked copying. Try another browser, or edit progress.json on GitHub directly.';
      ui.tone = 'error';
      paintEditbar();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(copied, function () { if (legacyCopy(text)) copied(); else blocked(); });
    } else if (legacyCopy(text)) {
      copied();
    } else {
      blocked();
    }
  }

  /* ---------- events ---------- */
  app.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'btn-edit') startEdit();
    else if (b.id === 'btn-cancel') stopEdit();
    else if (b.id === 'btn-copy') copyUpdate();
  });

  app.addEventListener('input', function (e) {
    var t = e.target;
    var id = t.getAttribute('data-for');
    if (!id || !draft) return;
    var it = findItem(draft, id);
    if (!it) return;
    if (t.getAttribute('data-field') === 'pct') {
      if (t.type === 'number' && t.value === '') return;
      it.pct = clampPct(t.value);
      var other = document.getElementById((t.type === 'range' ? 'n-' : 'r-') + id);
      if (other) other.value = it.pct;
    } else {
      it.note = t.value.slice(0, 60);
    }
    if (ui.tone !== 'error') { ui.msg = ''; ui.tone = ''; }
    paint();
  });

  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.type !== 'number' || !draft) return;
    var it = findItem(draft, t.getAttribute('data-for'));
    if (it) t.value = it.pct;
  });

  window.addEventListener('hashchange', function () {
    if (location.hash !== '#edit' || ui.canEdit || !saved) return;
    ui.canEdit = true;
    var box = document.getElementById('actions');
    if (box && !ui.editing) box.innerHTML = actionsHTML();
  });

  /* ---------- boot ---------- */
  fetch('progress.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (s) { saved = s; render(); })
    .catch(function () {
      app.innerHTML = '<p class="loading">The progress data could not be loaded. Refresh the page to try again.</p>';
    });
})();
</script>
</body>
</html>
